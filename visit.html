<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Visit</title>
<meta name="apple-mobile-web-app-title" content="Site Visits">
<meta name="theme-color" content="#14304a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy race-header band, then stacked section cards; sticky navy submit bar */
:root{
  --navy:#14304a; --navy-2:#1d4466; --yellow:#ffd200; --red:#ef3a2f; --orange:#ff8a1f; --ink-on-yellow:#14243a;
  --bg:#eef1f5; --surface:#ffffff; --fg:#14243a; --muted:#5d6b7c; --line:#d9e0e8;
  --good:#16804a; --good-bg:#dff3e7; --needs:#a65b00; --needs-bg:#ffefd6; --emerg:#c4271c; --emerg-bg:#fde3e0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0b1724; --surface:#132538; --fg:#eaf0f6; --muted:#97a8ba; --line:#22384f;
  --good:#5fd394; --good-bg:#12342a; --needs:#ffb54d; --needs-bg:#3b2a12; --emerg:#ff8a7a; --emerg-bg:#3f1714; color-scheme:dark}}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
.gutter{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.inner{max-width:620px;margin:0 auto}
a{color:inherit}

.band{position:relative;overflow:hidden;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.band .inner{position:relative;padding-block:14px 22px;display:flex;flex-direction:column;gap:12px}
.stripes{position:absolute;right:-110px;top:-50px;width:230px;height:240px;transform:rotate(-24deg);display:flex;gap:9px}
.stripes i{display:block;width:22px;height:100%;border-radius:4px}
.stripes i:nth-child(1){background:var(--red)}.stripes i:nth-child(2){background:var(--orange)}.stripes i:nth-child(3){background:var(--yellow)}
.top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px}
.back,.iconbtn{font:inherit;font-size:.8rem;font-weight:700;padding:7px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.28);background:rgba(20,48,74,.75);color:#fff;cursor:pointer;text-decoration:none;white-space:nowrap}
.kicker{position:relative;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
h1{position:relative;font-family:var(--display);font-style:italic;font-weight:800;font-size:2.6rem;line-height:.9;margin:2px 0 0;text-transform:uppercase}
.me{position:relative;font-size:.82rem;color:#c7d5e4}
.me a{color:var(--yellow);font-weight:600}

.wrap{display:flex;flex-direction:column;gap:22px;padding-block:20px 130px}
h2{font-family:var(--display);font-style:italic;font-weight:800;font-size:1.45rem;letter-spacing:.04em;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2::before{content:"";width:22px;height:14px;flex-shrink:0;transform:skewX(-20deg);
  background:linear-gradient(90deg,var(--red) 0 30%,transparent 30% 35%,var(--orange) 35% 65%,transparent 65% 70%,var(--yellow) 70%)}
.priv{font-family:var(--body);font-style:normal;font-size:.66rem;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:var(--navy);color:var(--yellow);text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(20,48,74,.06)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-note{color:var(--muted);font-size:.85rem;margin:0}
.items{display:flex;flex-direction:column;overflow:hidden}
.item{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;border-left:4px solid transparent}
.item:first-child{border-top:0}
.item.needs{background:var(--needs-bg);border-left-color:var(--orange)}
.item.emergency{background:var(--emerg-bg);border-left-color:var(--red)}
.ihead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.itext{min-width:0}
.it{font-weight:700}
.id{color:var(--muted);font-size:.84rem;margin-top:2px}
.seg{display:flex;flex-shrink:0;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{font:inherit;font-size:.8rem;font-weight:700;padding:8px 11px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"].g{background:var(--good);color:#fff}
.seg button[aria-pressed="true"].n{background:var(--orange);color:#1d1203}
.seg button[aria-pressed="true"].e{background:var(--red);color:#fff}
@media (max-width:440px){.ihead{flex-direction:column}.seg{align-self:stretch}.seg button{flex:1}}
.extras{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.extras textarea,.extras .thumbs{align-self:stretch}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:.8rem;font-weight:700;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
textarea,input[type=text],input[type=email],input[type=date]{font:inherit;width:100%;box-sizing:border-box;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.item.needs textarea,.item.emergency textarea{background:var(--surface)}
textarea{min-height:72px;resize:vertical}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.fields .full{grid-column:1/-1}
@media (max-width:440px){.fields{grid-template-columns:1fr}}
label.l{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.82rem;min-width:0}
.req{color:var(--red)}
.yn{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
.yn:first-child{border-top:0}
.ynrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.toggle-q{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.pad{padding:16px;display:flex;flex-direction:column;gap:10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;
  padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.bar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.count{font-size:.85rem;color:#c7d5e4;font-variant-numeric:tabular-nums}
.count b{color:var(--yellow)}
button.primary{font:inherit;font-weight:800;padding:13px 24px;border-radius:12px;border:0;background:var(--yellow);color:var(--ink-on-yellow);cursor:pointer;letter-spacing:.02em}
button.primary:disabled{opacity:.6}
.msg{padding:12px 14px;border-radius:12px;font-size:.9rem}
.msg.err{background:var(--emerg-bg);color:var(--emerg)}
.msg.warn{background:var(--needs-bg);color:var(--needs)}
.done{padding-block:60px 40px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.done .big{font-family:var(--display);font-style:italic;font-weight:800;font-size:3.4rem;line-height:.9;text-transform:uppercase}
.done p{margin:0;max-width:34ch}
.done .back{background:var(--navy);border-color:var(--navy)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
</style>
</head>
<body>
<header class="band gutter">
  <div class="stripes" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="inner">
    <div class="top">
      <a class="back" href="./">‹ Hub</a>
      <button class="iconbtn" id="refresh" type="button">↻ Refresh</button>
    </div>
    <div>
      <div class="kicker" id="kicker"></div>
      <h1 id="title">Site Visit</h1>
    </div>
    <span class="me" id="me"></span>
  </div>
</header>
<div class="wrap inner gutter" id="app">


  <section class="card" id="profile" hidden>
    <div class="pad">
      <strong>Where should your reports go?</strong>
      <span class="me">Asked once. It's saved on this phone.</span>
      <label class="l" for="rmName">Your name<input type="text" id="rmName" autocomplete="name"></label>
      <label class="l" for="rmEmail">Your work email<input type="email" id="rmEmail" autocomplete="email" inputmode="email"></label>
      <button class="primary" type="button" id="saveProfile">Save</button>
      <div class="msg err" id="profileErr" hidden></div>
    </div>
  </section>

  <div class="msg warn" id="loading">Loading checklist…</div>
  <div id="main" hidden style="display:contents">
  <section class="card">
    <div class="fields">
      <label class="l" for="location"><span>Location <span class="req">*</span></span><input type="text" id="location" placeholder="Store name"></label>
      <label class="l" for="date">Date<input type="date" id="date"></label>
      <label class="l full" for="mod"><span>Manager on duty <span class="req">*</span></span><input type="text" id="mod" placeholder="Name"></label>
    </div>
  </section>

  <div id="form" class="sec" style="gap:22px"></div>
  </div>
</div>

<div class="inner gutter done" id="doneView" hidden>
  <div class="big" id="doneBig">Sent</div>
  <p id="doneText">Check your inbox for the GM report and your RM-only notes.</p>
  <a class="back" href="./">Back to the hub</a>
</div>

<div class="bar" id="bar">
  <div class="bar-in">
    <span class="count" id="count"></span>
    <button class="primary" type="button" id="submit">Submit</button>
  </div>
</div>

<script src="checklists.js"></script>
<script>
const params = new URLSearchParams(location.search);
const CUSTOM_ID = params.get("custom");
const TYPE = CUSTOM_ID ? "custom" : (params.get("type") === "tunnel" ? "tunnel" : "ops");
const DRAFT_KEY = "svh-draft-" + (CUSTOM_ID ? "c-" + CUSTOM_ID : TYPE);
let CFG = null;
function $(id){ return document.getElementById(id); }
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function today(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }

// state: items[id] = {s, note, photos[]}, texts, answers, fs, photos[blockId][]
let S = { items:{}, texts:{}, answers:{}, notes:{}, fs:null, photos:{} };
const draft = lsGet(DRAFT_KEY);
if (draft && draft.state) { S = Object.assign(S, draft.state); for (const k in S.items) S.items[k].photos = []; S.photos = {}; }

function saveDraft(){
  const st = JSON.parse(JSON.stringify(S, (k,v)=> k==="photos" ? undefined : v));
  lsSet(DRAFT_KEY, { state: st, date:$("date").value, location:$("location").value, mod:$("mod").value });
}
["date","location","mod"].forEach(id=>$(id).addEventListener("input", saveDraft));

/* ---- profile ---- */
function showMe(){
  const p = lsGet(PROFILE_KEY);
  const me = $("me"); me.innerHTML = "";
  if (p && p.email){
    me.append((CFG && CFG.emailMe === false ? "Signed in as " : "Reports go to ") + p.email + " · ");
    const b = el("a", null, "Change"); b.href="#"; b.onclick = e=>{ e.preventDefault(); $("rmName").value=p.name||""; $("rmEmail").value=p.email; $("profile").hidden=false; };
    me.append(b); $("profile").hidden = true;
  } else { $("profile").hidden = false; }
}
$("saveProfile").onclick = ()=>{
  const name=$("rmName").value.trim(), email=$("rmEmail").value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $("profileErr").textContent="Enter a full email address, like name@speeders.com."; $("profileErr").hidden=false; return; }
  $("profileErr").hidden=true; lsSet(PROFILE_KEY,{name,email}); showMe();
  if (!CFG) boot();
};

/* ---- photos ---- */
async function shrink(file){
  const MAX = 1280;
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch(e){ bmp = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
  const w = bmp.width, h = bmp.height, k = Math.min(1, MAX/Math.max(w,h));
  const c = document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg", 0.72);
}
function photoPicker(list, rerender){
  const wrap = el("div","extras");
  const thumbs = el("div","thumbs");
  list.forEach((src,i)=>{
    const t=el("div","thumb"); const im=el("img"); im.src=src; im.alt="Photo "+(i+1);
    const x=el("button",null,"×"); x.type="button"; x.setAttribute("aria-label","Remove photo"); x.onclick=()=>{ list.splice(i,1); rerender(); };
    t.append(im,x); thumbs.append(t);
  });
  const inp = el("input"); inp.type="file"; inp.accept="image/*"; inp.multiple=true; inp.hidden=true;
  inp.onchange = async ()=>{ for (const f of inp.files){ try { list.push(await shrink(f)); } catch(e){} } rerender(); };
  const btn = el("button","chip", list.length ? "Add another photo" : "Add photo"); btn.type="button"; btn.onclick=()=>inp.click();
  if (list.length) wrap.append(thumbs);
  wrap.append(btn, inp);
  return wrap;
}

/* ---- render ---- */
function itemState(id){ return S.items[id] || (S.items[id] = { s:"good", note:"", photos:[] }); }

function renderItem(it){
  const st = itemState(it.id);
  const box = el("div","item " + (st.s==="good"?"":st.s));
  const head = el("div","ihead");
  const tx = el("div","itext"); const tt = el("div","it",it.t); if (it.private){ tt.append(" ", el("span","priv","RM only")); }
  tx.append(tt); if (it.d) tx.append(el("div","id",it.d));
  const seg = el("div","seg"); seg.setAttribute("role","group"); seg.setAttribute("aria-label",it.t);
  const opts = [["good","Good","g"],["needs","Needs work","n"]]; if (CFG.levels===3) opts.push(["emergency","Emergency","e"]);
  opts.forEach(([v,lab,c])=>{
    const b=el("button",c,lab); b.type="button"; b.setAttribute("aria-pressed", String(st.s===v));
    b.onclick=()=>{ st.s=v; if(v!=="good") st.open=true; refresh(box, it); saveDraft(); count(); };
    seg.append(b);
  });
  head.append(tx, seg); box.append(head);
  const flagged = st.s !== "good";
  const ex = el("div","extras");
  if (flagged || st.open || st.note){
    const ta = el("textarea"); ta.id="n-"+it.id; ta.value=st.note;
    ta.placeholder = st.s==="emergency" ? "What's wrong and who did you contact? (required)" : "Notes";
    ta.setAttribute("aria-label","Notes for "+it.t);
    ta.oninput=()=>{ st.note=ta.value; saveDraft(); };
    ex.append(ta);
  }
  const tools = el("div","tools");
  if (!(flagged || st.open || st.note)){ const nb=el("button","chip","+ Note"); nb.type="button"; nb.onclick=()=>{ st.open=true; refresh(box,it); }; tools.append(nb); }
  if (tools.childNodes.length) ex.append(tools);
  if (flagged && it.photo) ex.append(photoPicker(st.photos, ()=>refresh(box,it)));
  if (ex.childNodes.length) box.append(ex);
  return box;
}
function refresh(box,it){ const n=renderItem(it); box.replaceWith(n); }

function sectionTitle(b){
  const h = el("h2",null,b.title);
  if (b.private) h.append(el("span","priv","RM only"));
  return h;
}

function render(){
  const f = $("form"); f.innerHTML="";
  CFG.blocks.forEach(b=>{
    if (b.fsOnly && S.fs !== true) return;
    const sec = el("section","sec");
    if (b.kind==="items"){
      if (!b.hideTitle) sec.append(sectionTitle(b));
      if (b.note) sec.append(el("p","sec-note",b.note));
      const card = el("div","card items");
      b.items.forEach(it=>{
        if (it.fs && S.fs !== true) return;
        card.append(renderItem(it));
      });
      sec.append(card);
    } else if (b.kind==="photo"){
      sec.append(sectionTitle(b));
      if (b.note) sec.append(el("p","sec-note",b.note));
      const card = el("div","card pad");
      const list = S.photos[b.id] || (S.photos[b.id] = []);
      const draw = ()=>{ card.innerHTML=""; card.append(photoPicker(list, draw)); };
      draw(); sec.append(card);
    } else if (b.kind==="toggle"){
      sec.append(sectionTitle(b));
      const card = el("div","card toggle-q");
      card.append(el("span","it",b.q));
      const seg = el("div","seg");
      [["Yes",true,"g"],["No",false,"n"]].forEach(([lab,v,c])=>{
        const btn=el("button",c,lab); btn.type="button"; btn.setAttribute("aria-pressed", String(S.fs===v));
        btn.onclick=()=>{ S.fs=v; saveDraft(); render(); };
        seg.append(btn);
      });
      card.append(seg); sec.append(card);
    } else if (b.kind==="text"){
      sec.append(sectionTitle(b));
      const card = el("div","card pad");
      const ta = el("textarea"); ta.id="t-"+b.id; ta.placeholder=b.placeholder||""; ta.value=S.texts[b.id]||"";
      ta.setAttribute("aria-label",b.title);
      ta.oninput=()=>{ S.texts[b.id]=ta.value; saveDraft(); };
      card.append(ta); sec.append(card);
    } else if (b.kind==="yesno"){
      sec.append(sectionTitle(b));
      const card = el("div","card");
      b.qs.forEach(q=>{
        const row = el("div","yn"); const top = el("div","ynrow");
        top.append(el("span","it",q.q));
        const seg = el("div","seg");
        [["Yes","yes","g"],["No","no","n"]].forEach(([lab,v,c])=>{
          const btn=el("button",c,lab); btn.type="button"; btn.setAttribute("aria-pressed", String(S.answers[q.id]===v));
          btn.onclick=()=>{ S.answers[q.id]=v; saveDraft(); render(); };
          seg.append(btn);
        });
        top.append(seg); row.append(top);
        if (q.noteOn && S.answers[q.id]===q.noteOn){
          const ta=el("textarea"); ta.id="q-"+q.id; ta.placeholder=q.notePh||"Notes"; ta.value=S.notes[q.id]||"";
          ta.oninput=()=>{ S.notes[q.id]=ta.value; saveDraft(); };
          row.append(ta);
        }
        card.append(row);
      });
      sec.append(card);
    }
    f.append(sec);
  });
  count();
}

function visibleItems(){
  const out=[];
  CFG.blocks.forEach(b=>{
    if (b.kind!=="items" || (b.fsOnly && S.fs!==true)) return;
    b.items.forEach(it=>{ if (!(it.fs && S.fs!==true)) out.push({b,it}); });
  });
  return out;
}
function count(){
  const v = visibleItems(); const n = v.filter(x=>itemState(x.it.id).s!=="good").length;
  $("count").innerHTML = n ? "<b>"+n+" flagged</b> · "+(v.length-n)+" good" : v.length+" items, all good";
}

/* ---- submit ---- */
function showErr(t){
  let m = $("submitErr");
  if (!m){ m = el("div","msg err"); m.id="submitErr"; $("form").after(m); }
  m.textContent=t; m.hidden=false; m.scrollIntoView({behavior:"smooth",block:"center"});
}
$("submit").onclick = async ()=>{
  if (!CFG) return;
  const prof = lsGet(PROFILE_KEY);
  if (!prof || !prof.email){ $("profile").hidden=false; $("profile").scrollIntoView({behavior:"smooth"}); return; }
  const loc=$("location").value.trim(), mod=$("mod").value.trim();
  if (!loc || !mod){ window.scrollTo({top:0,behavior:"smooth"}); showErr("Fill in the location and manager on duty first."); return; }
  if (CFG.blocks.some(b=>b.id==="fs") && S.fs===null){ showErr("Answer the Full Service question."); return; }
  const missing = visibleItems().find(x=>{ const st=itemState(x.it.id); return st.s==="emergency" && !st.note.trim(); });
  if (missing){ showErr("Add a note for the emergency on \""+missing.it.t+"\": what's wrong and who you contacted."); return; }

  const sections = [];
  CFG.blocks.forEach(b=>{
    if (b.kind!=="items" || (b.fsOnly && S.fs!==true)) return;
    const items = b.items.filter(it=>!(it.fs && S.fs!==true)).map(it=>{
      const st=itemState(it.id);
      return { t:it.t, d:it.d||"", s:st.s, note:st.note||"", private: !!(b.private||it.private), photos: st.photos.map(p=>p.split(",")[1]) };
    });
    sections.push({ title:b.title, private:!!b.private, items });
  });
  const texts = CFG.blocks.filter(b=>b.kind==="text").map(b=>({ title:b.title, private:!!b.private, value:S.texts[b.id]||"", id:b.id }));
  const questions = [];
  CFG.blocks.filter(b=>b.kind==="yesno").forEach(b=>b.qs.forEach(q=>questions.push({ q:q.q, a:S.answers[q.id]||"", note:S.notes[q.id]||"" })));
  const photoSections = CFG.blocks.filter(b=>b.kind==="photo").map(b=>({ title:b.title, photos:(S.photos[b.id]||[]).map(p=>p.split(",")[1]) })).filter(p=>p.photos.length);
  const noEmail = CFG.emailMe === false;
  const payload = { type:TYPE, checklistId:CUSTOM_ID||"", typeTitle:CFG.title, location:loc, date:$("date").value, mod,
    rmName:prof.name||"", rmEmail:prof.email, fullService:S.fs, sections, texts, questions, photoSections, noEmail };

  const btn=$("submit"); btn.disabled=true; btn.textContent="Sending…";
  try {
    await callScript(payload);
    lsDel(DRAFT_KEY);
    $("app").hidden=true; $("bar").hidden=true; $("doneView").hidden=false;
    const priv = texts.some(t=>t.private && t.value.trim()) || sections.some(sec=>sec.items.some(i=>i.private && (i.note || i.s!=="good")));
    $("doneText").textContent = noEmail
      ? "Saved to the visit log. This checklist is set not to email you, so nothing was sent."
      : priv
        ? "Two emails are on their way to " + prof.email + ": the GM report you can forward, and your RM-only notes."
        : "Your report is on its way to " + prof.email + ". It's the GM version, so you can forward it as is.";
    $("doneBig").textContent = noEmail ? "Saved" : "Sent";
    window.scrollTo(0,0);
  } catch(e){
    showErr("It didn't send. " + (e.message||"") + " Your answers are still here, so check your signal and tap Submit again. Photos stay too, as long as you don't leave this page.");
  } finally { btn.disabled=false; btn.textContent="Submit"; }
};

/* ---- start ---- */
function start(){
  document.title = CFG.title;
  $("title").textContent = CFG.title;
  $("kicker").textContent = CFG.kicker;
  $("date").value = (draft && draft.date) || today();
  $("location").value = (draft && draft.location) || "";
  $("mod").value = (draft && draft.mod) || "";
  $("loading").hidden = true;
  $("main").hidden = false;
  showMe();
  render();
}
async function boot(){
  if (!CUSTOM_ID){ CFG = STANDARD[TYPE]; start(); return; }
  const cache = lsGet(CUSTOM_CACHE_KEY) || {};
  if (cache[CUSTOM_ID]){ CFG = customToCfg(cache[CUSTOM_ID].def); start(); }
  const prof = lsGet(PROFILE_KEY);
  if (!prof || !prof.email){ if (!CFG){ $("loading").textContent = "Add your work email above to load your checklist."; showMe(); } return; }
  try {
    const j = await callScript({ action:"listChecklists", email:prof.email });
    const c = (j.checklists||[]).find(x=>x.id===CUSTOM_ID);
    j.checklists.forEach(x=>{ cache[x.id]=x; }); lsSet(CUSTOM_CACHE_KEY, cache);
    if (!c){ if (!CFG) $("loading").textContent = "This checklist couldn't be found. It may have been deleted or unshared."; return; }
    if (!CFG){ CFG = customToCfg(c.def); start(); }
  } catch(e){
    if (!CFG) $("loading").textContent = "Couldn't load this checklist. Check your signal and tap Refresh.";
  }
}

$("refresh").onclick = ()=>{ const u=new URL(location.href); u.searchParams.set("r", Date.now()); location.replace(u.toString()); };
boot();
</script>
