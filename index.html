<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Visits</title>
<meta name="apple-mobile-web-app-title" content="Site Visits">
<meta name="theme-color" content="#14304a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy race-header band with helmet stripes, two big visit tiles, then quick links */
:root{
  --navy:#14304a; --navy-2:#1d4466; --yellow:#ffd200; --red:#ef3a2f; --orange:#ff8a1f;
  --bg:#eef1f5; --surface:#ffffff; --fg:#14243a; --muted:#5d6b7c; --line:#d9e0e8; --ink-on-yellow:#14243a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0b1724; --surface:#132538; --fg:#eaf0f6; --muted:#97a8ba; --line:#22384f; color-scheme:dark}}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
.gutter{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.inner{max-width:560px;margin:0 auto}

/* header band */
.band{position:relative;overflow:hidden;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.band .inner{position:relative;padding-block:18px 26px;display:flex;align-items:center;gap:14px}
.stripes{position:absolute;right:-120px;top:-40px;width:260px;height:240px;transform:rotate(-24deg);display:flex;gap:10px;opacity:.95}
.stripes i{display:block;width:26px;height:100%;border-radius:4px}
.stripes i:nth-child(1){background:var(--red)}
.stripes i:nth-child(2){background:var(--orange)}
.stripes i:nth-child(3){background:var(--yellow)}
.mascot{width:64px;height:auto;flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));position:relative}
.titles{position:relative;min-width:0;flex:1}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:2.7rem;line-height:.9;margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em}
.today{font-size:.85rem;color:#c7d5e4;margin-top:6px;font-variant-numeric:tabular-nums}
.hbtns{position:relative;display:flex;flex-direction:column;gap:8px;align-self:flex-start}
.iconbtn{font:inherit;font-size:.78rem;font-weight:700;padding:7px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.28);background:rgba(20,48,74,.75);color:#fff;cursor:pointer;white-space:nowrap}
.iconbtn[aria-expanded="true"]{background:var(--yellow);color:var(--ink-on-yellow);border-color:var(--yellow)}

main.inner{display:flex;flex-direction:column;gap:26px;padding-block:22px 40px}
h2{font-family:var(--display);font-style:italic;font-weight:700;font-size:1.25rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

/* visit tiles */
.visits{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.visits{grid-template-columns:1fr}}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:150px;
  padding:16px;border-radius:18px;text-decoration:none;min-width:0;box-shadow:0 6px 18px rgba(20,48,74,.14);transition:transform .12s ease}
.tile:active{transform:scale(.98)}
.tile.tunnel{background:var(--navy-2);color:#fff}
.tile.ops{background:var(--yellow);color:var(--ink-on-yellow)}
.tile .state{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.tile .dot{width:8px;height:8px;border-radius:50%}
.tile.tunnel .dot{background:var(--red)}
.tile.ops .dot{background:#1c9a55;box-shadow:0 0 0 3px rgba(28,154,85,.25)}
.tile .name{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(1.3rem,5.6vw,1.9rem);line-height:.92;text-transform:uppercase}
.tile .go{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;font-weight:600}
.tile .arrow{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;font-weight:700}
.tile.tunnel .arrow{background:var(--yellow);color:var(--ink-on-yellow)}
.tile.ops .arrow{background:var(--navy);color:#fff}
.tile .streak{position:absolute;right:-30px;top:-20px;width:90px;height:140px;transform:rotate(-24deg);display:flex;gap:6px;opacity:.18}
.tile .streak i{flex:1;background:currentColor;border-radius:3px}

/* links */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .badge{width:36px;height:36px;border-radius:10px;background:var(--navy);color:var(--yellow);display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:1.05rem;flex-shrink:0}
.row a.go{flex:1;min-width:0;color:inherit;text-decoration:none;display:flex;flex-direction:column}
.row .t{font-weight:600}
.row .u{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .arrow{color:var(--muted);font-size:1.3rem}
.del{background:none;border:0;color:var(--red);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;padding:6px}
body:not(.editing) .del{display:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.add{display:flex;flex-direction:column;gap:10px}
.lbl{font-weight:700}
.add .fields{display:flex;gap:8px;flex-wrap:wrap}
.add input{flex:1 1 160px;min-width:0;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button.primary{font:inherit;font-weight:700;padding:12px 18px;border-radius:12px;border:0;background:var(--yellow);color:var(--ink-on-yellow);cursor:pointer}
.hint{color:var(--muted);font-size:.8rem;margin:0}
.err{color:var(--red);font-size:.85rem;margin:0}
.mylist .row a.go .u{white-space:normal}
.mine-tag{display:inline-block;margin-left:6px;font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--bg);color:var(--muted);vertical-align:2px}
.rowbtn{font:inherit;font-size:.78rem;font-weight:700;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;white-space:nowrap}
.build{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-top:1px solid var(--line);font-weight:700;color:var(--fg);text-decoration:none;background:var(--bg)}
.build span{width:24px;height:24px;border-radius:50%;background:var(--yellow);color:var(--ink-on-yellow);display:grid;place-items:center;font-weight:800}
.empty{padding:16px;color:var(--muted);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:700;padding:12px 18px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.tile{transition:none}}
</style>
</head>
<body>
<header class="band gutter">
  <div class="stripes" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="inner">
    <img class="mascot" src="mascot.png" alt="">
    <div class="titles">
      <div class="eyebrow">NJ Region</div>
      <h1>Site Visits</h1>
      <div class="today" id="today"></div>
    </div>
    <div class="hbtns">
      <button class="iconbtn" id="refresh" type="button">↻ Refresh</button>
      <button class="iconbtn" id="gear" type="button" aria-expanded="false" aria-controls="settings">Settings</button>
    </div>
  </div>
</header>

<main class="inner gutter">
  <section id="settings" hidden>
    <h2>Settings</h2>
    <div class="panel">
      <form class="add" id="addForm" novalidate>
        <label class="lbl" for="newName">Add a quick link</label>
        <div class="fields">
          <input id="newName" placeholder="Name, e.g. Daily Report" autocomplete="off">
          <input id="newUrl" placeholder="Paste link" inputmode="url" autocomplete="off">
        </div>
        <button class="primary" type="submit">Add link</button>
        <p class="err" id="err" hidden></p>
        <p class="hint">Links you add are saved on this phone only. To remove one, tap Remove next to it while Settings is open.</p>
      </form>
    </div>
    <h2 style="margin-top:18px">Checklists</h2>
    <div class="list mylist" id="manage"></div>
  </section>

  <section>
    <h2>Start a visit</h2>
    <div class="visits">
      <a class="tile tunnel" href="visit.html?type=tunnel">
        <div class="streak" aria-hidden="true"><i></i><i></i><i></i></div>
        <span class="state"><span class="dot"></span>Wash off</span>
        <span class="name">Tunnel<br>Walk</span>
        <span class="go">19 checks<span class="arrow">›</span></span>
      </a>
      <a class="tile ops" href="visit.html?type=ops">
        <div class="streak" aria-hidden="true"><i></i><i></i><i></i></div>
        <span class="state"><span class="dot"></span>Wash running</span>
        <span class="name">Operations<br>Visit</span>
        <span class="go">Full site<span class="arrow">›</span></span>
      </a>
    </div>
  </section>

  <section id="mineSec" hidden>
    <h2>My checklists</h2>
    <div class="list mylist" id="mine"></div>
  </section>

  <section>
    <h2>Quick links</h2>
    <div class="list" id="links"></div>
  </section>
</main>
<div class="toast" id="toast" hidden></div>

<script src="checklists.js"></script>
<script>
// Built-in links. To add one for everyone: copy a line and change the name and link.
const LINKS = [
  { name: "Leaderboard", url: "https://leaderboard.summitwashholdings.com/#" },
  { name: "CSA Evaluation", url: "https://airtable.com/appEzYVXmnkikWT9w/pagw8Ln8KWp50rQ62/form" },
  { name: "Site Score", url: "https://sitescore.summitwashholdings.com/#" }
];

const KEY = "svh-custom-links";
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; } }
function save(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
function host(u){ try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return u; } }
function initials(n){ return n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }

document.getElementById("today").textContent =
  new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});

function render(){
  const box = document.getElementById("links");
  box.innerHTML = "";
  const custom = load();
  const all = [...LINKS.map(l=>({...l,builtin:true})), ...custom.map((l,i)=>({...l,idx:i}))];
  all.forEach(l=>{
    const row = document.createElement("div"); row.className = "row";
    const badge = document.createElement("span"); badge.className="badge"; badge.textContent = initials(l.name); badge.setAttribute("aria-hidden","true");
    const a = document.createElement("a"); a.className = "go"; a.href = l.url; a.target = "_blank"; a.rel = "noopener";
    const t = document.createElement("span"); t.className="t"; t.textContent = l.name;
    const u = document.createElement("span"); u.className="u"; u.textContent = host(l.url);
    a.append(t,u); row.append(badge,a);
    if (!l.builtin){
      const d = document.createElement("button"); d.className = "del"; d.type = "button"; d.textContent = "Remove";
      d.onclick = ()=>{ const c = load(); c.splice(l.idx,1); save(c); render(); };
      row.appendChild(d);
    }
    const ar = document.createElement("span"); ar.className="arrow"; ar.textContent="›"; ar.setAttribute("aria-hidden","true"); row.appendChild(ar);
    box.appendChild(row);
  });
}

document.getElementById("addForm").addEventListener("submit", e=>{
  e.preventDefault();
  const n = document.getElementById("newName"), u = document.getElementById("newUrl"), err = document.getElementById("err");
  let url = u.value.trim(); const name = n.value.trim();
  if (url && !/^https?:\/\//i.test(url)) url = "https://" + url;
  let ok = false; try { new URL(url); ok = true; } catch(_){}
  if (!name || !ok){ err.textContent = !name ? "Give the link a name." : "That link doesn't look right. Paste the full address."; err.hidden = false; return; }
  err.hidden = true;
  const c = load(); c.push({name, url}); save(c);
  n.value = ""; u.value = ""; render();
});

const gear = document.getElementById("gear"), panel = document.getElementById("settings");
gear.addEventListener("click", ()=>{
  const open = panel.hidden;
  panel.hidden = !open;
  gear.setAttribute("aria-expanded", String(open));
  gear.textContent = open ? "Done" : "Settings";
  document.body.classList.toggle("editing", open);
});
document.getElementById("refresh").addEventListener("click", ()=>{
  const u = new URL(location.href); u.searchParams.set("r", Date.now()); location.replace(u.toString());
});

render();

/* ---- My checklists ---- */
function mkRow(c, withBtn){
  const row=document.createElement("div"); row.className="row";
  const badge=document.createElement("span"); badge.className="badge"; badge.textContent=initials(c.title)||"✓"; badge.setAttribute("aria-hidden","true");
  const a=document.createElement("a"); a.className="go";
  a.href = withBtn ? (c.mine ? "builder.html?id=" : "builder.html?copy=") + encodeURIComponent(c.id) : "visit.html?custom="+encodeURIComponent(c.id);
  const t=document.createElement("span"); t.className="t"; t.textContent=c.title;
  if (c.mine && c.shared){ const tag=document.createElement("span"); tag.className="mine-tag"; tag.textContent="Shared"; t.append(tag); }
  const u=document.createElement("span"); u.className="u";
  u.textContent = c.mine ? ((c.def && c.def.subtitle) || "Yours") : "Shared by " + (c.ownerName || c.owner);
  a.append(t,u); row.append(badge,a);
  if (withBtn){ const btn=document.createElement("a"); btn.className="rowbtn"; btn.href=a.href; btn.textContent = c.mine ? "Edit" : "Copy"; row.append(btn); }
  else { const ar=document.createElement("span"); ar.className="arrow"; ar.textContent="›"; ar.setAttribute("aria-hidden","true"); row.append(ar); }
  return row;
}
function drawMine(list, note){
  const box=document.getElementById("mine"), man=document.getElementById("manage");
  box.innerHTML=""; man.innerHTML="";
  document.getElementById("mineSec").hidden = !list.length;
  list.forEach(c=>{ box.append(mkRow(c,false)); man.append(mkRow(c,true)); });
  if (note || !list.length){ const e=document.createElement("div"); e.className="empty"; e.textContent = note || "Build your own checklist for a lube center, detail shop, hand wash or anything else, or copy one of the standard ones and change it."; man.append(e); }
  const b=document.createElement("a"); b.className="build"; b.href="builder.html";
  b.innerHTML='<span aria-hidden="true">+</span>Build a checklist';
  man.append(b);
}
async function loadMine(){
  const p = lsGet(PROFILE_KEY);
  const cache = lsGet(CUSTOM_CACHE_KEY) || {};
  const cached = Object.values(cache).sort((a,b)=>(b.mine-a.mine)||a.title.localeCompare(b.title));
  if (!p || !p.email){ drawMine([], "Build a checklist to get started. You'll be asked for your work email once."); return; }
  drawMine(cached);
  try {
    const j = await callScript({ action:"listChecklists", email:p.email });
    const fresh={}; (j.checklists||[]).forEach(c=>fresh[c.id]=c); lsSet(CUSTOM_CACHE_KEY, fresh);
    drawMine(j.checklists||[]);
  } catch(e){ if (!cached.length) drawMine([], "Couldn't load your checklists. Check your signal and tap Refresh."); }
}
loadMine();
if (new URLSearchParams(location.search).get("saved")){
  const t=document.getElementById("toast"); t.textContent="Checklist saved"; t.hidden=false;
  setTimeout(()=>{ t.hidden=true; },2500);
  history.replaceState(null,"",location.pathname);
}
</script>
</body>
</html>
