<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Visits</title>
<meta name="apple-mobile-web-app-title" content="Site Visits">
<meta name="theme-color" content="#0a6fb8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
/* Layout: single phone-first column — header, two big visit tiles, then a quick-links list you can add to */
:root{
  --bg:#eef3f6; --surface:#ffffff; --fg:#122230; --muted:#5b6d7b; --line:#d5dfe6;
  --accent:#0a6fb8; --accent-ink:#ffffff; --wet:#d9ecf8; --warn:#9a5a00; --warn-bg:#fdf0da;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c161e; --surface:#14222d; --fg:#e6eef4; --muted:#93a6b4; --line:#243644;
  --accent:#4fb0f0; --accent-ink:#06131c; --wet:#16344a; --warn:#f2b45a; --warn-bg:#3a2a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c161e; --surface:#14222d; --fg:#e6eef4; --muted:#93a6b4; --line:#243644;
  --accent:#4fb0f0; --accent-ink:#06131c; --wet:#16344a; --warn:#f2b45a; --warn-bg:#3a2a12; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.today{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
h2{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.visits{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.visits{grid-template-columns:1fr}}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;min-width:0;overflow:hidden}
.tile .state{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.tile .name{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.05;text-transform:uppercase}
.tile .sub{color:var(--muted);font-size:.86rem}
.tile .chip{align-self:flex-start;margin-top:6px;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--warn-bg);color:var(--warn)}
.tile .drip{position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--wet)}
.tile > *:not(.drip){position:relative}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row a.go{flex:1;min-width:0;color:inherit;text-decoration:none;display:flex;flex-direction:column}
.row .t{font-weight:600}
.row .u{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .arrow{color:var(--accent);font-size:1.3rem;font-weight:600}
.row.pending .t::after{content:" · link needed";color:var(--warn);font-weight:500;font-size:.85rem}
.del{background:none;border:0;color:var(--muted);font-size:.8rem;cursor:pointer;padding:6px}
.add{display:flex;flex-direction:column;gap:8px}
.hdr-right{display:flex;align-items:center;gap:12px}
.gear{font:inherit;font-size:.85rem;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.gear[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.lbl{font-weight:600}
body:not(.editing) .del{display:none}
.add .fields{display:flex;gap:8px;flex-wrap:wrap}
.add input{flex:1 1 160px;min-width:0;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.primary{font:inherit;font-weight:600;padding:11px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.hint{color:var(--muted);font-size:.8rem;margin:0}
.err{color:var(--warn);font-size:.85rem;margin:0}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Site Visit Hub</h1>
    <div class="hdr-right">
      <div class="today" id="today"></div>
      <button class="gear" id="gear" type="button" aria-expanded="false" aria-controls="settings">Settings</button>
    </div>
  </header>

  <section class="settings" id="settings" hidden>
    <h2>Settings</h2>
    <div class="panel">
      <form class="add" id="addForm" novalidate>
        <label class="lbl" for="newName">Add a quick link</label>
        <div class="fields">
          <input id="newName" placeholder="Name, e.g. Daily Report" autocomplete="off">
          <input id="newUrl" placeholder="Paste link" inputmode="url" autocomplete="off">
        </div>
        <button class="primary" type="submit">Add link</button>
        <p class="err" id="err" hidden></p>
        <p class="hint">Links you add are saved on this phone only. To remove one, tap Remove next to it in Quick Links while Settings is open.</p>
      </form>
    </div>
  </section>

  <section>
    <h2>Visits</h2>
    <div class="visits">
      <a class="tile" href="visit.html?type=tunnel">
        <span class="drip"></span>
        <span class="state">Wash shut down</span>
        <span class="name">Tunnel Walk</span>
        <span class="sub">Pre-opening tunnel inspection</span>
      </a>
      <a class="tile" href="visit.html?type=ops">
        <span class="drip"></span>
        <span class="state">Wash running</span>
        <span class="name">Operations Visit</span>
        <span class="sub">Full site, people and guest check</span>
      </a>
    </div>
  </section>

  <section>
    <h2>Quick Links</h2>
    <div class="list" id="links"></div>
  </section>
</div>

<script>
// Built-in links. To add one for everyone: copy a line and change the name and link.
const LINKS = [
  { name: "Leaderboard", url: "https://leaderboard.summitwashholdings.com/#" },
  { name: "CSA Evaluation", url: "https://airtable.com/appEzYVXmnkikWT9w/pagw8Ln8KWp50rQ62/form" },
  { name: "Site Score", url: "https://sitescore.summitwashholdings.com/#" }
];

const KEY = "svh-custom-links";
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; } }
function save(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }

document.getElementById("today").textContent =
  new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});

function host(u){ try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return u; } }

function render(){
  const box = document.getElementById("links");
  box.innerHTML = "";
  const custom = load();
  const all = [...LINKS.map(l=>({...l,builtin:true})), ...custom.map((l,i)=>({...l,idx:i}))];
  all.forEach(l=>{
    const row = document.createElement("div");
    row.className = "row" + (l.url ? "" : " pending");
    const a = document.createElement(l.url ? "a" : "div");
    a.className = "go";
    if (l.url){ a.href = l.url; a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML = '<span class="t"></span><span class="u"></span>';
    a.querySelector(".t").textContent = l.name;
    a.querySelector(".u").textContent = l.url ? host(l.url) : "Add the link to turn this on";
    row.appendChild(a);
    if (!l.builtin){
      const d = document.createElement("button");
      d.className = "del"; d.type = "button"; d.textContent = "Remove";
      d.onclick = ()=>{ const c = load(); c.splice(l.idx,1); save(c); render(); };
      row.appendChild(d);
    }
    if (l.url){ const ar = document.createElement("span"); ar.className="arrow"; ar.textContent="›"; row.appendChild(ar); }
    box.appendChild(row);
  });
}

document.getElementById("addForm").addEventListener("submit", e=>{
  e.preventDefault();
  const n = document.getElementById("newName"), u = document.getElementById("newUrl"), err = document.getElementById("err");
  let url = u.value.trim(); const name = n.value.trim();
  if (url && !/^https?:\/\//i.test(url)) url = "https://" + url;
  let ok = false; try { new URL(url); ok = true; } catch(_){}
  if (!name || !ok){ err.textContent = !name ? "Give the link a name." : "That link doesn't look right. Paste the full address."; err.hidden = false; return; }
  err.hidden = true;
  const c = load(); c.push({name, url}); save(c);
  n.value = ""; u.value = ""; render();
});

const gear = document.getElementById("gear"), panel = document.getElementById("settings");
gear.addEventListener("click", ()=>{
  const open = panel.hidden;
  panel.hidden = !open;
  gear.setAttribute("aria-expanded", String(open));
  gear.textContent = open ? "Done" : "Settings";
  document.body.classList.toggle("editing", open);
});

render();
</script>
</body>
</html>
